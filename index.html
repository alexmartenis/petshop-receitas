<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Receita Mensal — Pet Shop</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🐾</span>
        <div class="logo-text">
          <span class="logo-title">Receita</span>
          <span class="logo-sub">Pet Shop</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="registos" onclick="showView('registos')">
          <i class="ti ti-pencil-plus"></i>
          <span>Registar</span>
        </button>
        <button class="nav-item" data-view="movimentos" onclick="showView('movimentos')">
          <i class="ti ti-list-details"></i>
          <span>Movimentos</span>
        </button>
        <button class="nav-item" data-view="dashboard" onclick="showView('dashboard')">
          <i class="ti ti-chart-bar"></i>
          <span>Dashboard</span>
        </button>
      </nav>

      <div class="sidebar-month">
        <div class="month-badge" id="sidebarMonth"></div>
        <button class="new-month-btn" onclick="confirmReset()">
          <i class="ti ti-refresh"></i> Novo mês
        </button>
      </div>

      <div class="sidebar-export">
        <button class="export-btn" onclick="exportData()"><i class="ti ti-download"></i> Exportar dados</button>
        <label class="import-btn"><i class="ti ti-upload"></i> Importar dados<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
      </div>
    </aside>

    <!-- MOBILE TOPBAR -->
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></button>
      <span class="topbar-title">🐾 Receita Pet Shop</span>
      <div class="topbar-month" id="topbarMonth"></div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- ===== VIEW: REGISTAR ===== -->
      <div class="view active" id="view-registos">
        <div class="page-header">
          <h1>Registar entrada</h1>
          <p class="page-sub" id="regDateSub"></p>
        </div>

        <!-- Métricas de hoje -->
        <div class="metrics-today" id="metricsToday"></div>

        <!-- Formulário -->
        <div class="form-card">
          <div class="form-date-row">
            <div class="form-field">
              <label><i class="ti ti-calendar"></i> Data do movimento</label>
              <input type="date" id="inDate">
              <div class="date-hint" id="dateHint"></div>
            </div>
          </div>
          <div class="form-values-row">
            <div class="form-field">
              <label><i class="ti ti-credit-card"></i> Multibanco (€)</label>
              <input type="number" id="inMB" placeholder="0,00" min="0" step="0.01">
            </div>
            <div class="form-field">
              <label><i class="ti ti-cash"></i> Numerário (€)</label>
              <input type="number" id="inNum" placeholder="0,00" min="0" step="0.01">
            </div>
            <div class="form-field">
              <label><i class="ti ti-device-mobile"></i> MBWay (€)</label>
              <input type="number" id="inMBW" placeholder="0,00" min="0" step="0.01">
            </div>
          </div>
          <button class="btn-confirm" onclick="addEntry()">
            <i class="ti ti-check"></i> Confirmar entrada
          </button>
        </div>

        <!-- Resumo do mês acumulado -->
        <div class="month-summary-card">
          <div class="summary-header">
            <i class="ti ti-sigma"></i> Total acumulado do mês
          </div>
          <div id="monthSummary"></div>
        </div>
      </div>

      <!-- ===== VIEW: MOVIMENTOS ===== -->
      <div class="view" id="view-movimentos">
        <div class="page-header">
          <h1>Movimentos do mês</h1>
          <p class="page-sub" id="movDateSub"></p>
        </div>

        <div class="filter-row">
          <label class="filter-label"><i class="ti ti-filter"></i> Filtrar por dia:</label>
          <input type="date" id="filterDate" onchange="renderMovimentos()">
          <button class="btn-clear-filter" onclick="clearFilter()"><i class="ti ti-x"></i> Todos</button>
        </div>

        <div class="table-card" id="movTable"></div>

        <div class="month-summary-card" style="margin-top:1.5rem">
          <div class="summary-header"><i class="ti ti-sigma"></i> Total acumulado do mês</div>
          <div id="monthSummary2"></div>
        </div>
      </div>

      <!-- ===== VIEW: DASHBOARD ===== -->
      <div class="view" id="view-dashboard">
        <div class="page-header">
          <h1>Dashboard</h1>
          <p class="page-sub">Histórico de receitas mensais</p>
        </div>

        <div class="legend-row">
          <span class="legend-item"><span class="legend-dot" style="background:#2563EB"></span>Multibanco</span>
          <span class="legend-item"><span class="legend-dot" style="background:#16A34A"></span>Numerário</span>
          <span class="legend-item"><span class="legend-dot" style="background:#D97706"></span>MBWay</span>
        </div>

        <div class="chart-card">
          <div class="chart-wrap">
            <canvas id="dashChart" role="img" aria-label="Gráfico de barras com receitas mensais"></canvas>
          </div>
        </div>

        <div class="dash-months" id="dashMonths"></div>

        <div class="detail-card" id="dashDetailCard">
          <div class="summary-header"><i class="ti ti-list"></i> Detalhe do mês</div>
          <div id="dashDetailContent"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- OVERLAY para mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
